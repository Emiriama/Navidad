<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Admin - Panadería Navideña</div>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="productos.html">Productos</a>
                <a href="usuarios.html" class="active">Usuarios</a>
                <a href="historial.html">Historial Ventas</a>
                <a href="#" id="navLogout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Gestión de Usuarios</h1>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <div class="card">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Fondos</th>
                        <th>Fecha Registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="usuariosBody"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/config.js?v=1"></script>
    <script src="../js/auth.js?v=1"></script>
    <script src="../js/admin.js?v=1"></script>
    <script>
         // Script para usuarios.html
// Reemplaza todo el contenido del último <script> dentro de usuarios.html

protegerPaginaAdmin();

document.addEventListener('DOMContentLoaded', () => {
    cargarUsuarios();
});

async function cargarUsuarios() {
    console.log('Cargando usuarios...');
    
    const tbody = document.getElementById('usuariosBody');
    
    if (!tbody) {
        console.error('Elemento usuariosBody no encontrado');
        return;
    }
    
    // Mostrar loading
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem;">Cargando usuarios...</td></tr>';
    
    try {
        const response = await fetchAuth(`${API_URL}/usuarios`);
        
        console.log('Respuesta usuarios status:', response.status);
        
        if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
        }
        
        const usuarios = await response.json();
        console.log('Usuarios recibidos:', usuarios);
        
        if (!usuarios || usuarios.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem; color: #666;">No hay usuarios registrados</td></tr>';
            return;
        }
        
        // Obtener usuario actual
        const usuarioActual = getUsuario();
        
        // Generar filas
        tbody.innerHTML = usuarios.map(u => {
            const esMiUsuario = usuarioActual && u.id_usuario === usuarioActual.id;
            
            return `
                <tr>
                    <td>${u.id_usuario}</td>
                    <td>${u.nombre_usuario}</td>
                    <td>${u.correo}</td>
                    <td>
                        <select onchange="cambiarRol(${u.id_usuario}, this.value)" 
                            ${esMiUsuario ? 'disabled' : ''}>
                            <option value="cliente" ${u.rol === 'cliente' ? 'selected' : ''}>Cliente</option>
                            <option value="administrador" ${u.rol === 'administrador' || u.rol === 'admin' ? 'selected' : ''}>Admin</option>
                        </select>
                    </td>
                    <td>${formatearMoneda(u.fondos)}</td>
                    <td>${formatearFecha(u.fecha_registro)}</td>
                    <td>
                        ${!esMiUsuario ? 
                            `<button class="btn btn-sm btn-danger" onclick="eliminarUsuario(${u.id_usuario})">Eliminar</button>` :
                            '<span style="color: #666;">Tu cuenta</span>'
                        }
                    </td>
                </tr>
            `;
        }).join('');
        
        console.log('Usuarios cargados exitosamente');
        
    } catch (error) {
        console.error('Error al cargar usuarios:', error);
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding: 2rem; color: #dc2626;">Error al cargar usuarios. Por favor, intenta nuevamente.</td></tr>';
        mostrarError('Error al cargar usuarios');
    }
}

async function cambiarRol(id, nuevoRol) {
    console.log(`Cambiando rol del usuario ${id} a ${nuevoRol}`);
    
    try {
        const response = await fetchAuth(`${API_URL}/usuarios/${id}/rol`, {
            method: 'PUT',
            body: JSON.stringify({ rol: nuevoRol })
        });

        if (response.ok) {
            mostrarExito('Rol actualizado exitosamente');
            console.log('Rol actualizado');
        } else {
            const errorData = await response.json();
            console.error('Error al cambiar rol:', errorData);
            mostrarError(errorData.error || 'Error al cambiar el rol');
            cargarUsuarios();
        }
    } catch (error) {
        console.error('Error al cambiar el rol:', error);
        mostrarError('Error al cambiar el rol');
        cargarUsuarios();
    }
}

async function eliminarUsuario(id) {
    if (!confirm('¿Eliminar este usuario? Esta acción no se puede deshacer.')) {
        return;
    }
    
    console.log(`Eliminando usuario ${id}`);

    try {
        const response = await fetchAuth(`${API_URL}/usuarios/${id}`, {
            method: 'DELETE'
        });

        if (response.ok) {
            mostrarExito('Usuario eliminado');
            console.log('Usuario eliminado exitosamente');
            cargarUsuarios();
        } else {
            const result = await response.json();
            console.error('Error al eliminar:', result);
            mostrarError(result.error || 'Error al eliminar usuario');
        }
    } catch (error) {
        console.error('Error al eliminar usuario:', error);
        mostrarError('Error al eliminar usuario');
    }
}
    </script>

    <style>
        select {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }
    </style>
</body>
</html>
