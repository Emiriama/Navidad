<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - Admin</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">🎄 Admin - Panadería Navideña</div>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="productos.html">Productos</a>
                <a href="usuarios.html">Usuarios</a>
                <a href="historial.html" class="active">Historial Ventas</a>
                <a href="../index.html">Ver Sitio</a>
                <a href="#" id="navLogout">Cerrar Sesión</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Historial de Ventas</h1>

        <!-- Filtros -->
        <div class="card">
            <h3>Filtrar por Fecha</h3>
            <form id="filtroForm" class="filtro-form">
                <div class="form-group">
                    <label for="fecha_inicio">Fecha Inicio</label>
                    <input type="date" id="fecha_inicio">
                </div>
                <div class="form-group">
                    <label for="fecha_fin">Fecha Fin</label>
                    <input type="date" id="fecha_fin">
                </div>
                <button type="submit" class="btn btn-primary">Filtrar</button>
                <button type="button" class="btn btn-secondary" onclick="limpiarFiltros()">Limpiar</button>
            </form>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <!-- Tabla de Ventas -->
        <div class="card">
            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Número de Venta</th>
                        <th>Usuario</th>
                        <th>Correo</th>
                        <th>Total</th>
                        <th>Fecha</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="ventasBody"></tbody>
            </table>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        protegerPaginaAdmin();

        document.addEventListener('DOMContentLoaded', () => {
            cargarVentas();
            document.getElementById('filtroForm').addEventListener('submit', filtrarVentas);
        });

        async function cargarVentas() {
            try {
                const response = await fetchAuth(`${API_URL}/ventas`);
                const ventas = await response.json();
                mostrarVentas(ventas);
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error al cargar el historial');
            }
        }

        async function filtrarVentas(e) {
            e.preventDefault();

            const fechaInicio = document.getElementById('fecha_inicio').value;
            const fechaFin = document.getElementById('fecha_fin').value;

            if (!fechaInicio && !fechaFin) {
                cargarVentas();
                return;
            }

            try {
                let url = `${API_URL}/ventas/fecha?`;
                if (fechaInicio) url += `fecha_inicio=${fechaInicio}&`;
                if (fechaFin) url += `fecha_fin=${fechaFin}`;

                const response = await fetchAuth(url);
                const ventas = await response.json();
                mostrarVentas(ventas);
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error al filtrar ventas');
            }
        }

        function limpiarFiltros() {
            document.getElementById('filtroForm').reset();
            cargarVentas();
        }

        function mostrarVentas(ventas) {
            const tbody = document.getElementById('ventasBody');

            if (ventas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">No hay ventas registradas</td></tr>';
                return;
            }

            tbody.innerHTML = ventas.map(v => `
                <tr>
                    <td><strong>${v.numero_venta}</strong></td>
                    <td>${v.nombre_usuario}</td>
                    <td>${v.correo}</td>
                    <td>${formatearMoneda(v.total)}</td>
                    <td>${formatearFecha(v.fecha_compra)}</td>
                    <td><span class="badge badge-${v.estado}">${v.estado}</span></td>
                </tr>
            `).join('');
        }
    </script>

    <style>
        .filtro-form {
            display: grid;
            grid-template-columns: 1fr 1fr auto auto;
            gap: 1rem;
            align-items: end;
        }
    </style>
</body>
</html>
